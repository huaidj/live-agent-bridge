[project]
name = "live-agent-bridge"
version = "1.0.0"
description = "Fast, full-featured MCP bridge between AI agents and Ableton Live (Live API Remote Script + FastMCP)"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
dependencies = ["mcp>=1.29,<2"]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.24", "ruff>=0.8"]
audio = ["numpy>=1.26,<3", "scipy>=1.11,<2", "soundfile>=0.12,<1"]
semantic = ["transformers>=4.45,<5", "torch>=2.6"]
rekordbox = ["pyrekordbox>=0.4,<1"]

[project.scripts]
live-agent-bridge = "live_agent_bridge.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/live_agent_bridge"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py311"
